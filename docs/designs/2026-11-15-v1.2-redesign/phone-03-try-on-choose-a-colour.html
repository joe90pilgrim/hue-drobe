<button type="button" aria-label="Navy" data-hex="#1f2a5a" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 10px; background: #1f2a5a; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Royal blue, from your palette" data-hex="#0b5cad" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 10px; background: #0b5cad; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Emerald, from your palette" data-hex="#108a5d" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 10px; background: #108a5d; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Charcoal" data-hex="#2b2b2b" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 10px; background: #2b2b2b; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Cream" data-hex="#f2ede3" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #f2ede3; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Beige" data-hex="#c8b89a" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #c8b89a; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Mid grey" data-hex="#8c8c8c" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #8c8c8c; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Black" data-hex="#1a1a1a" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #1a1a1a; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

<button type="button" aria-label="Brown" data-hex="#5b4636" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #5b4636; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></button>

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 500; color: #3D3D3D">Colour</span></span>
<input type="range" min="0" max="359" value="229" id="h" style="background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)">
</label>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 500; color: #3D3D3D">Strength</span><span style="color: #5C5C5C">greyer to richer</span></span>
<input type="range" min="0" max="100" value="66" id="s" style="background: linear-gradient(to right, #595959, #001059)">
</label>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 500; color: #3D3D3D">Lightness</span><span style="color: #5C5C5C">darker to lighter</span></span>
<input type="range" min="0" max="100" value="35" id="v" style="background: linear-gradient(to right, #000000, #5776ff)">
</label>
</div>

</div></div>
<script>const CHOOSER = {"size": 44, "radius": 10, "ringBg": "#FFFFFF"};
(function () {
  const st = { h: 229, s: 66, v: 35, favs: ['#1f2a5a', '#ce1249', '#0b5cad', '#108a5d', '#2b2b2b'] };
  const NAMES = { '#1f2a5a': 'Navy', '#ce1249': 'True red, from your palette', '#0b5cad': 'Royal blue, from your palette', '#108a5d': 'Emerald, from your palette', '#2b2b2b': 'Charcoal', '#ffffff': 'White', '#f2ede3': 'Cream', '#c8b89a': 'Beige', '#8c8c8c': 'Mid grey', '#1a1a1a': 'Black', '#5b4636': 'Brown' };
  const $ = (id) => document.getElementById(id);
  function hsvToHex(h, s, v) {
    s /= 100; v /= 100;
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    const to = (x) => Math.round(x * 255).toString(16).padStart(2, '0');
    return '#' + to(f(5)) + to(f(3)) + to(f(1));
  }
  function hexToHsv(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return { h: Math.round(h), s: max ? Math.round((d / max) * 100) : 0, v: Math.round(max * 100) };
  }
  const favGroup = document.querySelector('[aria-label="Favourite colours"]');
  function tileHtml(x) {
    return '<button type="button" data-hex="' + x + '" aria-label="' + (NAMES[x] || x) + '" style="width: ' + CHOOSER.size + 'px; height: ' + CHOOSER.size + 'px; border: 0; border-radius: ' + CHOOSER.radius + 'px; background: ' + x + '"></button>';
  }
  function draw() {
    const hex = hsvToHex(st.h, st.s, st.v);
    $('swatch').style.background = hex;
    $('tee').setAttribute('fill', hex);
    if (document.activeElement !== $('code')) $('code').value = hex.toUpperCase();
    $('h').value = st.h; $('s').value = st.s; $('v').value = st.v;
    $('s').style.background = 'linear-gradient(to right, ' + hsvToHex(st.h, 0, st.v) + ', ' + hsvToHex(st.h, 100, st.v) + ')';
    $('v').style.background = 'linear-gradient(to right, #000000, ' + hsvToHex(st.h, st.s, 100) + ')';
    favGroup.innerHTML = st.favs.map(tileHtml).join('');
    document.querySelectorAll('[data-hex]').forEach((b) => {
      const on = b.dataset.hex === hex;
      b.style.boxShadow = on ? '0 0 0 2px ' + CHOOSER.ringBg + ', 0 0 0 4px #161616' : 'inset 0 0 0 1px rgba(0,0,0,0.12)';
      b.setAttribute('aria-label', (NAMES[b.dataset.hex] || b.dataset.hex) + (on ? ', chosen' : ''));
    });
    const isFav = st.favs.includes(hex);
    const fav = $('fav');
    fav.setAttribute('aria-pressed', String(isFav));
    fav.style.border = isFav ? '1px solid #161616' : '1px solid #D6D6D6';
    fav.querySelector('svg').setAttribute('fill', isFav ? '#161616' : 'none');
  }
  ['h', 's', 'v'].forEach((k) => $(k).addEventListener('input', (e) => { st[k] = +e.target.value; draw(); }));
  $('code').addEventListener('input', (e) => {
    let t = e.target.value.trim();
    if (t && t[0] !== '#') t = '#' + t;
    if (/^#[0-9a-fA-F]{6}$/.test(t)) { Object.assign(st, hexToHsv(t.toLowerCase())); draw(); }
  });
  $('code').addEventListener('blur', draw);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-hex]');
    if (b) { Object.assign(st, hexToHsv(b.dataset.hex)); draw(); }
  });
  $('fav').addEventListener('click', () => {
    const hex = hsvToHex(st.h, st.s, st.v);
    st.favs = st.favs.includes(hex) ? st.favs.filter((x) => x !== hex) : st.favs.concat(hex);
    draw();
  });
  draw();
})();
</script>
