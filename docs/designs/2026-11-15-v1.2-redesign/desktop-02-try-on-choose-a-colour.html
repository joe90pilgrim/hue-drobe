<script>const CHOOSER = {"size": 40, "radius": 9, "ringBg": "#F7F7F7"};
(function () {
  const st = { h: 229, s: 66, v: 35, favs: ['#1f2a5a', '#ce1249', '#0b5cad', '#108a5d', '#2b2b2b'] };
  const NAMES = { '#1f2a5a': 'Navy', '#ce1249': 'True red, from your palette', '#0b5cad': 'Royal blue, from your palette', '#108a5d': 'Emerald, from your palette', '#2b2b2b': 'Charcoal', '#ffffff': 'White', '#f2ede3': 'Cream', '#c8b89a': 'Beige', '#8c8c8c': 'Mid grey', '#1a1a1a': 'Black', '#5b4636': 'Brown' };
  const $ = (id) => document.getElementById(id);
  function hsvToHex(h, s, v) {
    s /= 100; v /= 100;
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    const to = (x) => Math.round(x * 255).toString(16).padStart(2, '0');
    return '#' + to(f(5)) + to(f(3)) + to(f(1));
  }
  function hexToHsv(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return { h: Math.round(h), s: max ? Math.round((d / max) * 100) : 0, v: Math.round(max * 100) };
  }
  const favGroup = document.querySelector('[aria-label="Favourite colours"]');
  function tileHtml(x) {
    return '<button type="button" data-hex="' + x + '" aria-label="' + (NAMES[x] || x) + '" style="width: ' + CHOOSER.size + 'px; height: ' + CHOOSER.size + 'px; border: 0; border-radius: ' + CHOOSER.radius + 'px; background: ' + x + '"></button>';
  }
  function draw() {
    const hex = hsvToHex(st.h, st.s, st.v);
    $('swatch').style.background = hex;
    $('tee').setAttribute('fill', hex);
    if (document.activeElement !== $('code')) $('code').value = hex.toUpperCase();
    $('h').value = st.h; $('s').value = st.s; $('v').value = st.v;
    $('s').style.background = 'linear-gradient(to right, ' + hsvToHex(st.h, 0, st.v) + ', ' + hsvToHex(st.h, 100, st.v) + ')';
    $('v').style.background = 'linear-gradient(to right, #000000, ' + hsvToHex(st.h, st.s, 100) + ')';
    favGroup.innerHTML = st.favs.map(tileHtml).join('');
    document.querySelectorAll('[data-hex]').forEach((b) => {
      const on = b.dataset.hex === hex;
      b.style.boxShadow = on ? '0 0 0 2px ' + CHOOSER.ringBg + ', 0 0 0 4px #161616' : 'inset 0 0 0 1px rgba(0,0,0,0.12)';
      b.setAttribute('aria-label', (NAMES[b.dataset.hex] || b.dataset.hex) + (on ? ', chosen' : ''));
    });
    const isFav = st.favs.includes(hex);
    const fav = $('fav');
    fav.setAttribute('aria-pressed', String(isFav));
    fav.style.border = isFav ? '1px solid #161616' : '1px solid #D6D6D6';
    fav.querySelector('svg').setAttribute('fill', isFav ? '#161616' : 'none');
  }
  ['h', 's', 'v'].forEach((k) => $(k).addEventListener('input', (e) => { st[k] = +e.target.value; draw(); }));
  $('code').addEventListener('input', (e) => {
    let t = e.target.value.trim();
    if (t && t[0] !== '#') t = '#' + t;
    if (/^#[0-9a-fA-F]{6}$/.test(t)) { Object.assign(st, hexToHsv(t.toLowerCase())); draw(); }
  });
  $('code').addEventListener('blur', draw);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-hex]');
    if (b) { Object.assign(st, hexToHsv(b.dataset.hex)); draw(); }
  });
  $('fav').addEventListener('click', () => {
    const hex = hsvToHex(st.h, st.s, st.v);
    st.favs = st.favs.includes(hex) ? st.favs.filter((x) => x !== hex) : st.favs.concat(hex);
    draw();
  });
  draw();
})();
</script>
