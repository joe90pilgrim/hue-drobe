<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue-drobe 1.2 – Menu – back up and restore</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:#000}
</style>
<style>@media (min-width: 520px){body{background:#d2d2d2;padding:32px 0}.frame{width:390px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:28px;overflow:hidden}}</style>
</head>
<body>
<div class="frame"><div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #F5F5F5; color: #161616; font-family: Inter, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0">
<iframe src="phone-01-try-on.html" title="" tabindex="-1" style="display: block; width: 100%; height: 844px; border: 0; pointer-events: none"></iframe>
</div>
<a href="phone-01-try-on.html" aria-label="Close the menu" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></a>

<section aria-label="Menu" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #CFCFCF; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: -6px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 700">Menu</h2>
<a href="phone-01-try-on.html" style="min-height: 44px; padding: 0 4px 0 12px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Close</a>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #E2E2E2; border-radius: 16px">
<h3 style="margin: 0; font-size: 16px; font-weight: 600">Back up and restore</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #3D3D3D">Save your clothes, outfits, favourite colours, quiz result and current look to a file. Restoring from a file replaces everything on this device.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<button type="button" style="height: 48px; border: 1px solid #D6D6D6; border-radius: 12px; background: #FFFFFF; color: #161616; font: inherit; font-size: 14px; font-weight: 600">Save a backup</button>
<button type="button" style="height: 48px; border: 1px solid #D6D6D6; border-radius: 12px; background: #FFFFFF; color: #161616; font: inherit; font-size: 14px; font-weight: 600">Restore from file</button>
</div>
</div>
</section>
</div></div>

</body>
</html>
